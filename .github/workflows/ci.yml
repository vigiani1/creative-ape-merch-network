name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Static, security, type, and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Project security boundary checks
        run: npm run quality

      - name: Dependency vulnerability audit
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          NEXT_PUBLIC_APP_URL: https://example.com
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  production-smoke:
    name: Production route smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production health and route boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://creative-ape-merch-network.vercel.app"

          echo "Waiting for a healthy production deployment..."
          for i in {1..30}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "Attempt $i: /api/health returned HTTP $code"
            sleep 10
          done

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/login")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/shop/demo")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/shop/demo/products/demo-tee")" = "200"

          for protected in /admin /admin/library /portal /portal/library; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$BASE_URL$protected" || true)"
            case "$code" in
              301|302|303|307|308) ;;
              *) echo "Expected $protected to redirect anonymous users, got HTTP $code"; exit 1 ;;
            esac
          done
